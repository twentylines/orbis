name: Orbis installer endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installer-site.yml'
      - 'scripts/publish-installer-site.py'
      - 'scripts/install-orbis.py'
      - 'scripts/orbis-installer-bundle.py'
      - 'scripts/orbis-install*.py'
      - 'scripts/orbis-host-*.py'
      - 'scripts/orbis-reset-*.py'
      - 'scripts/orbis-release-*.py'
      - 'scripts/orbis-proxy-identity.py'
      - 'scripts/migration-preflight.py'
      - 'packaging/systemd/orbis-host.service'
      - 'scripts/test_orbis_installer_site.py'
      - 'scripts/test_orbis_installer_bundle.py'
      - 'scripts/test_orbis_install_ui.py'
  workflow_run:
    workflows: ['Orbis release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-installer-endpoint
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      INSTALLER_WORK: ${{ github.workspace }}/.orbis-installer-endpoint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare installer working files
        run: |
          umask 077
          mkdir -p "$INSTALLER_WORK/tmp"
      - name: Check endpoint selection and verification
        env:
          TMPDIR: ${{ github.workspace }}/.orbis-installer-endpoint/tmp
        run: python3 -m unittest discover -s scripts -p 'test_orbis_installer_site.py' -v
      - name: Verify the newest published installer
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.orbis-installer-endpoint/tmp
        run: |
          gh api 'repos/twentylines/orbis/releases?per_page=100' > "$INSTALLER_WORK/releases.json"
          python3 scripts/publish-installer-site.py "$INSTALLER_WORK/releases.json" "$INSTALLER_WORK/public" --channels --if-available --github-output "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
        if: steps.installer.outputs.available == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.installer.outputs.available == 'true'
        with:
          path: ${{ github.workspace }}/.orbis-installer-endpoint/public
      - name: Publish installer endpoint
        if: steps.installer.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
