name: Orbis installer endpoint

on:
  workflow_run:
    workflows: ['Orbis release']
    types: [completed]
  workflow_dispatch:
    inputs:
      public_release_run:
        description: Successful public release workflow run to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbis-installer-endpoint
  cancel-in-progress: false

jobs:
  release-admission:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publish: ${{ steps.public.outputs.publish }}
    steps:
      - name: Require a verified public release
        id: public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ inputs.public_release_run || github.event.workflow_run.id }}
        run: |
          [[ "$UPSTREAM_RUN" =~ ^[0-9]+$ ]]
          run_path="repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN"
          gh api "$run_path" --jq '[.path, .conclusion, .head_repository.full_name] | join(" ")' |
            { read -r workflow conclusion repository
              [[ "${workflow%@*}" == ".github/workflows/release.yml" && "$conclusion" == success && "$repository" == "$GITHUB_REPOSITORY" ]]
            }
          published="$(gh api "$run_path/jobs" --jq '
            [.jobs[] | select(.name == "publish" and .conclusion == "success") |
              .steps[] | select(.name == "Verify the GitHub release is public" and .conclusion == "success")] | length == 1
          ')"
          echo "publish=$published" >> "$GITHUB_OUTPUT"

  verify:
    needs: release-admission
    if: needs.release-admission.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  integration:
    needs: release-admission
    if: needs.release-admission.outputs.publish == 'true'
    uses: ./.github/workflows/integration-tests.yml

  publish:
    needs: [release-admission, verify, integration]
    if: needs.release-admission.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      INSTALLER_WORK: ${{ github.workspace }}/.orbis-installer-endpoint
      INSTALLER_ARTIFACT_NAME: orbis-installer-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the verified source to remain current
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Prepare installer working files
        run: |
          umask 077
          mkdir -p "$INSTALLER_WORK/tmp"
      - name: Check endpoint selection and verification
        working-directory: scripts
        env:
          TMPDIR: ${{ github.workspace }}/.orbis-installer-endpoint/tmp
        run: python3 -m unittest test_orbis_installer_site test_orbis_installer_bundle test_orbis_installer_contract test_orbis_host_dependency_closure test_orbis_host_observer_profile test_orbis_host_service_upgrade -v
      - name: Verify the newest published installer
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/.orbis-installer-endpoint/tmp
        run: |
          gh api 'repos/twentylines/orbis/releases?per_page=100' > "$INSTALLER_WORK/releases.json"
          python3 scripts/publish-installer-site.py "$INSTALLER_WORK/releases.json" "$INSTALLER_WORK/public" --channels --preserve-installers --if-available --github-output "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
        if: steps.installer.outputs.available == 'true'
      - uses: actions/upload-pages-artifact@v5
        id: pages_artifact
        if: steps.installer.outputs.available == 'true'
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: ${{ github.workspace }}/.orbis-installer-endpoint/public
      - name: Wait for the uploaded installer artifact
        if: steps.installer.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          artifact_id = os.environ['INSTALLER_ARTIFACT_ID']
          if not artifact_id.isdecimal():
              raise SystemExit('The uploaded installer artifact ID is invalid.')
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          deadline = time.monotonic() + 60
          ready_observations = 0
          while time.monotonic() < deadline:
              try:
                  response = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True,
                                            timeout=min(15, max(1, deadline - time.monotonic())))
                  if response.returncode == 0:
                      value = json.loads(response.stdout)
                      matches = [item for item in value['artifacts']
                                 if item['name'] == os.environ['INSTALLER_ARTIFACT_NAME']]
                      if len(matches) > 1:
                          raise SystemExit('The installer artifact selection is ambiguous.')
                      if matches:
                          item = matches[0]
                          if (str(item['id']) != artifact_id or item['expired'] is not False
                                  or item['size_in_bytes'] <= 0
                                  or item['workflow_run']['head_sha'] != os.environ['GITHUB_SHA']):
                              raise SystemExit('The uploaded installer artifact does not match this source.')
                          ready_observations += 1
                          if ready_observations >= 2:
                              print('The uploaded installer artifact is ready.')
                              break
                      else:
                          ready_observations = 0
                  else:
                      ready_observations = 0
              except (subprocess.TimeoutExpired, ValueError, KeyError, TypeError):
                  ready_observations = 0
              time.sleep(min(2, max(0, deadline - time.monotonic())))
          else:
              raise SystemExit('The uploaded installer artifact did not become available in time.')
          PY
      - name: Publish installer endpoint
        if: steps.installer.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.INSTALLER_ARTIFACT_NAME }}
