name: Official upgrade runtime

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact Core commit from a verified publisher run
        required: true
        type: string
      target_digest:
        description: Exact verified OCI index digest
        required: true
        type: string
      stable_bridge:
        description: First install Stable and upgrade to the verified bridge source
        default: false
        type: boolean

      checkpoint_recovery:
        description: Deliberately interrupt this disposable backed upgrade at a verified checkpoint
        default: false
        type: boolean

      core_commit_recovery:
        description: Interrupt after verified Core commit and before the coordinated terminal record
        default: false
        type: boolean

      installed_cli_update:
        description: Install and update an app via the real CLI and a disposable two-revision store
        default: false
        type: boolean

      ota_delivery:
        description: Exercise the installed Updates path or reproduce legacy discovery
        default: installer
        type: choice
        options:
          - installer
          - in-app
          - legacy-discovery

      pre_effect_recovery:
        description: Deliberate interruption before any installed component changes
        type: choice
        default: none
        options:
          - none
          - source-selection
          - target-custody

permissions:
  actions: read
  contents: read

jobs:
  official-upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.stable_bridge && 55 || 40 }}
    env:
      TARGET_COMMIT: ${{ inputs.target_commit }}
      TARGET_DIGEST: ${{ inputs.target_digest }}
      STABLE_BRIDGE: ${{ inputs.stable_bridge }}
      CHECKPOINT_RECOVERY: ${{ inputs.checkpoint_recovery }}
      CORE_COMMIT_RECOVERY: ${{ inputs.core_commit_recovery }}
      INSTALLED_CLI_UPDATE: ${{ inputs.installed_cli_update }}
      OTA_DELIVERY: ${{ inputs.ota_delivery }}
      PRE_EFFECT_RECOVERY: ${{ inputs.pre_effect_recovery }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify the coordinated update on a disposable Linux runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo --non-interactive --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_TOKEN,RUNNER_ENVIRONMENT,STABLE_BRIDGE,CHECKPOINT_RECOVERY,CORE_COMMIT_RECOVERY,INSTALLED_CLI_UPDATE,OTA_DELIVERY,PRE_EFFECT_RECOVERY,TARGET_COMMIT,TARGET_DIGEST \
            /usr/bin/python3 -I -B packages/backend/scripts/orbis-official-upgrade-runtime.py
