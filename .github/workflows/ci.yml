name: Orbis CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-key-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify Node.js security baseline
        run: node packages/backend/scripts/verify-node-security.cjs

      - name: Verify CLI key isolation across Linux users
        run: |
          fixture_parent="$(mktemp -d "${GITHUB_WORKSPACE:?}/.orbis-permissions-XXXXXX")"
          chmod 0711 "$fixture_parent"
          trap 'sudo --non-interactive rm -rf -- "$fixture_parent"' EXIT
          node_binary="$(command -v node)"
          sudo --non-interactive env TMPDIR="$fixture_parent" ORBIS_CLI_KEY_TEST_ROOT="$fixture_parent" \
            "$node_binary" --experimental-strip-types --test \
            packages/backend/src/common/helpers/__tests__/permissions-linux.test.mjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            bunx biome ci . --changed --since="$BASE_SHA" --error-on-warnings --no-errors-on-unmatched
          else
            bunx biome ci . --changed --since=origin/main --error-on-warnings --no-errors-on-unmatched
          fi

      - name: Run tests
        run: |
          TMPDIR="$(mktemp -d "${GITHUB_WORKSPACE:?}/.orbis-tests.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          bun run test

      - name: Verify maintenance proxy streaming
        run: node --test scripts/test-orbis-maintenance-proxy.mjs

      - name: Verify controller bootstrap probe bundle
        run: bun packages/backend/scripts/build-controller-bootstrap-profile.ts --check

      - name: Check release labels
        run: bun test packages/frontend/src/desktop/orbis-version.test.ts

      - name: Check Docker network cleanup ownership
        run: node --test packages/backend/scripts/verify-network-prune.test.cjs

      - name: Check generated client and translation URL security
        run: bun test scripts/browser-dependencies.test.ts

      - name: Check published UI audit guards and diagnostics
        run: node scripts/live-compact-ui-qa.cjs --self-check

      - name: Check migration and release planning
        run: |
          TMPDIR="$(mktemp -d "${GITHUB_WORKSPACE:?}/.orbis-tests.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build client
        run: bun run bundle

      - name: Run tsc
        run: bun run tsc
