name: Orbis CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            bunx biome ci . --changed --since="$BASE_SHA" --error-on-warnings --no-errors-on-unmatched
          else
            bunx biome ci . --changed --since=origin/main --error-on-warnings --no-errors-on-unmatched
          fi

      - name: Run tests
        run: bun run test

      - name: Check migration and release planning
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: "./.github/actions/install-dependencies"

      - name: Build client
        run: bun run bundle

      - name: Run tsc
        run: bun run tsc
