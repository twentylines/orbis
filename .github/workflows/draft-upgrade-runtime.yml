name: Draft upgrade runtime

on:
  workflow_dispatch:
    inputs:
      bridge_tag:
        description: Draft tag for the 4.10.1 bridge
        required: true
        type: string
      bridge_run:
        description: Successful release workflow run for the bridge
        required: true
        type: string
      target_tag:
        description: Draft tag for the 4.12.0 target
        required: true
        type: string
      target_run:
        description: Successful release workflow run for the target
        required: true
        type: string
      release_commit:
        description: Exact source commit from both publishers when testing an earlier pair
        required: false
        type: string
      rehearsal:
        description: Qualification of the verified Orbis draft pair
        required: true
        type: choice
        options:
          - source-selection-recovery
          - target-custody-recovery
          - checkpoint-recovery
          - core-commit-recovery
          - installed-cli-update
          - updates-after-enrollment
          - public-discovery-after-enrollment

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    if: github.repository == 'twentylines/orbis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.rehearsal == 'updates-after-enrollment' || inputs.rehearsal == 'public-discovery-after-enrollment') && 55 || 45 }}
    env:
      DRAFT_UPGRADE_CASE: ${{ inputs.rehearsal }}
      DRAFT_BRIDGE_TAG: ${{ inputs.bridge_tag }}
      DRAFT_BRIDGE_RUN: ${{ inputs.bridge_run }}
      DRAFT_TARGET_TAG: ${{ inputs.target_tag }}
      DRAFT_TARGET_RUN: ${{ inputs.target_run }}
      DRAFT_RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # GitHub restricts draft visibility to credentials with push access.
      # Only this acquisition step receives that token. The installed product
      # receives only the exact verified bytes on the disposable runner.
      - name: Acquire the exact signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo --non-interactive --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GH_TOKEN,RUNNER_ENVIRONMENT,DRAFT_UPGRADE_CASE,DRAFT_BRIDGE_TAG,DRAFT_BRIDGE_RUN,DRAFT_TARGET_TAG,DRAFT_TARGET_RUN,DRAFT_RELEASE_COMMIT \
            /usr/bin/python3 -I -B packages/backend/scripts/orbis-official-upgrade-runtime.py --acquire-drafts

      - name: Rehearse the signed draft pair
        shell: bash
        run: |
          umask 077
          mkdir .orbis-upgrade-qualification
          sudo --non-interactive --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,RUNNER_ENVIRONMENT,DRAFT_UPGRADE_CASE,DRAFT_BRIDGE_TAG,DRAFT_BRIDGE_RUN,DRAFT_TARGET_TAG,DRAFT_TARGET_RUN,DRAFT_RELEASE_COMMIT \
            /usr/bin/python3 -I -B packages/backend/scripts/orbis-official-upgrade-runtime.py | tee .orbis-upgrade-qualification/result.json

      - name: Seal verified public OTA identity
        if: inputs.rehearsal == 'public-discovery-after-enrollment'
        run: |
          jq -e --arg tag "$DRAFT_TARGET_TAG" --arg commit "${DRAFT_RELEASE_COMMIT:-$GITHUB_SHA}" '
            select(.schema == "orbis.official-upgrade-runtime.v1" and .phase == "complete" and .passed == true
              and .draftRehearsal == "public-discovery-after-enrollment"
              and .runtipi == "4.12.0" and .draftManifestAsset == "qualified-release-manifest.json"
              and .legacyQualifiedTargetHiddenVerified == true and .stableBridgeVerified == true
              and .updatesPlanApplyVerified == true and .updatesApiVerified == true
              and .componentTerminalVerified == true and .markerChecks == 2
              and .targetProgress.boundToTerminalOperation == true and .targetProgress.boundSamples > 0
              and .targetProgress.missingSamplesBetweenBoundReads == 0
              and .target == $tag and .targetCommit == $commit and .targetDigest == .draftTargetDigest
              and (.targetDigest | test("^sha256:[0-9a-f]{64}$")))
            | {schema:"orbis.installer-qualified-approval.v1",tag:.target,commit:.targetCommit,digest:.targetDigest}
          ' .orbis-upgrade-qualification/result.json > .orbis-upgrade-qualification/approval.json

      - name: Retain verified public OTA identity
        if: inputs.rehearsal == 'public-discovery-after-enrollment'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbis-qualified-public-ota-${{ github.run_id }}-${{ github.run_attempt }}
          path: .orbis-upgrade-qualification/approval.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
