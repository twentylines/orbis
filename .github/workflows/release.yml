name: Orbis release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  integration:
    uses: ./.github/workflows/integration-tests.yml

  publish:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate release identity and metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/orbis-release-metadata.py --tag "$RELEASE_TAG" --notes "releases/${RELEASE_TAG}.md" --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Orbis image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            TIPI_VERSION=4.10.1
            LOCAL=true
            ORBIS_VERSION=${{ github.ref_name }}
            ORBIS_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Record immutable image and release notes
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          UPDATE_PRIORITY: ${{ steps.metadata.outputs.priority }}
        run: |
          jq -n \
            --arg schema 'orbis.release.v1' \
            --arg image "$IMAGE" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg updatePriority "$UPDATE_PRIORITY" \
            --arg migrationFingerprint "$(python3 scripts/orbis-migration-fingerprint.py)" \
            -f scripts/release-manifest.jq \
            > release-manifest.json
          cp "releases/${RELEASE_TAG}.md" release-notes.md
          printf '\n\nImage: %s@%s\n' "$IMAGE" "$IMAGE_DIGEST" >> release-notes.md

      - name: Package the source-bound installer
        run: python3 scripts/orbis-installer-bundle.py release-manifest.json installer-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPLAY_VERSION: ${{ steps.metadata.outputs.displayVersion }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "Orbis $DISPLAY_VERSION" --notes-file release-notes.md)
          if [[ "$IS_PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release-manifest.json installer-assets/install-orbis.py installer-assets/orbis-installer-manifest.json installer-assets/orbis-installer.tar.gz "${flags[@]}"
