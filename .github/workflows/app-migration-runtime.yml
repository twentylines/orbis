name: App migration runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.orbis-engine-cache
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.orbis-engine-cache/bun
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: ${{ github.workspace }}/.orbis-engine-cache/transpiler
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare checkout-local temporary storage
        run: |
          mkdir -p "$XDG_CACHE_HOME/tmp"
          echo "TMPDIR=$XDG_CACHE_HOME/tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Pull the immutable database fixture
        run: docker pull --quiet docker.io/library/postgres@sha256:09f23e02d76670d3b346a3c00aa33a27cf57aab8341eedfcdaed41459d14f5c4

      - name: Verify real migration execution and data recovery
        run: |
          fixture_parent="$(mktemp -d "${GITHUB_WORKSPACE:?}/.orbis-engine-XXXXXX")"
          trap 'if test -f "$fixture_parent/cleanup-complete"; then sudo --non-interactive rm -rf -- "$fixture_parent"; fi' EXIT
          node_binary="$(command -v node)"
          cd packages/backend
          sudo --non-interactive env TMPDIR="$fixture_parent" \
            ORBIS_MIGRATION_ENGINE_TEST=1 ORBIS_MIGRATION_TEST_ROOT="$fixture_parent" \
            "$node_binary" node_modules/vitest/vitest.mjs run --config vitest.engine.config.mts
