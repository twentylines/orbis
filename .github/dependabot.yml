version: 2
updates:
  - package-ecosystem: 'bun'
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: 'daily'
    rebase-strategy: 'auto'
