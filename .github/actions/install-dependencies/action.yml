name: Install dependencies

description: Install dependencies

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      name: Install Node.js
      with:
        node-version-file: .node-version

    - name: Verify Node.js security baseline
      shell: bash
      run: |
        node packages/backend/scripts/verify-node-security.cjs
        node --test packages/backend/scripts/verify-node-security.test.cjs

    - uses: oven-sh/setup-bun@v2
      name: Install Bun
      with:
        bun-version: "1.3.0"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build
      shell: bash
      run: bun run build
